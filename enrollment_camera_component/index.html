<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Gate Enrollment Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
      overflow: hidden;
    }

    .gate-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6), 0 0 0 1px #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Video Viewport */
    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirrored view for natural applicant alignment */
    }

    /* Vignette Mask around Oval */
    .vignette-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* The Vertical Biometric Face Circle/Oval Guide */
    .oval-guide {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 175px;
      height: 245px;
      border-radius: 50% / 50%;
      pointer-events: none;
      z-index: 10;
      transition: all 0.25s ease-out;
    }

    /* State 1: Red / Pending / Unaligned / Below 100% */
    .oval-guide.state-red {
      border: 3.5px dashed #ef4444;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6), inset 0 0 18px rgba(239, 68, 68, 0.25);
      animation: pulseRed 1.8s infinite ease-in-out;
    }

    @keyframes pulseRed {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 18px rgba(239, 68, 68, 0.5); }
      50% { border-color: #f87171; box-shadow: 0 0 32px rgba(248, 113, 113, 0.85); }
    }

    /* State 2: Green / 100% Pure & Clear */
    .oval-guide.state-green {
      border: 4.5px solid #22c55e;
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.85), inset 0 0 25px rgba(34, 197, 94, 0.35);
      animation: pulseGreen 1.4s infinite ease-in-out;
    }

    @keyframes pulseGreen {
      0%, 100% { border-color: #22c55e; box-shadow: 0 0 25px rgba(34, 197, 94, 0.6); }
      50% { border-color: #4ade80; box-shadow: 0 0 45px rgba(74, 222, 128, 0.95); }
    }

    /* Crosshair Center Reference Marks */
    .oval-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .state-red .oval-crosshair {
      color: #fca5a5;
      opacity: 0.45;
    }

    .state-green .oval-crosshair {
      color: #86efac;
      opacity: 0.75;
    }

    /* Controls Panel below Viewport */
    .controls-panel {
      width: 100%;
      padding: 12px 18px;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* Big Action Capture Button */
    .capture-btn {
      width: 100%;
      max-width: 420px;
      padding: 13px 24px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .capture-btn.disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.8;
      border: 1px solid #475569;
    }

    .capture-btn.enabled {
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
      animation: buttonReadyPulse 1.8s infinite;
    }

    @keyframes buttonReadyPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); }
      50% { transform: scale(1.02); box-shadow: 0 6px 22px rgba(34, 197, 94, 0.7); }
    }

    /* Retake Button Bar */
    .retake-bar {
      display: none;
      width: 100%;
      max-width: 420px;
    }

    .retake-btn {
      width: 100%;
      padding: 12px 18px;
      background: #475569;
      color: #f8fafc;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retake-btn:hover { background: #64748b; }

    /* Flash Effect */
    .camera-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.25s ease-out;
    }

    /* Preview of Captured Frame */
    .preview-canvas {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="gate-container">
    <div class="viewport">
      <video id="webcam" playsinline autoplay muted></video>
      <canvas id="previewCanvas" class="preview-canvas"></canvas>
      <div id="flash" class="camera-flash"></div>

      <!-- Vignette SVG Overlay with Vertical Oval Cutout -->
      <svg class="vignette-mask" viewBox="0 0 600 450" preserveAspectRatio="none">
        <defs>
          <mask id="ovalHoleMask">
            <rect width="600" height="450" fill="white" />
            <ellipse cx="300" cy="216" rx="88" ry="122" fill="black" />
          </mask>
        </defs>
        <rect width="600" height="450" fill="rgba(10, 15, 29, 0.72)" mask="url(#ovalHoleMask)" />
      </svg>

      <!-- The Vertical Oval Viewfinder Guide -->
      <div id="ovalGuide" class="oval-guide state-red">
        <!-- Crosshair Guides for Chin & Eye alignment -->
        <svg class="oval-crosshair" viewBox="0 0 175 245">
          <line x1="25" y1="92" x2="150" y2="92" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1.5" />
          <line x1="87.5" y1="20" x2="87.5" y2="225" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1.5" />
          <circle cx="62" cy="92" r="3.5" fill="currentColor" opacity="0.8" />
          <circle cx="113" cy="92" r="3.5" fill="currentColor" opacity="0.8" />
        </svg>
      </div>
    </div>

    <!-- Controls Panel (Outside the video frame) -->
    <div class="controls-panel">
      <button id="captureBtn" class="capture-btn disabled" disabled>
        <span id="btnIcon">🔒</span>
        <span id="btnText">FIT FACE IN CIRCLE (100% TO UNLOCK)</span>
      </button>

      <div id="retakeBar" class="retake-bar">
        <button id="retakeBtn" class="retake-btn">🔄 Retake Photo</button>
      </div>
    </div>
  </div>

  <!-- Offscreen canvas for frame analysis and snapshot capture -->
  <canvas id="analysisCanvas" width="240" height="180" style="display:none;"></canvas>
  <canvas id="captureCanvas" style="display:none;"></canvas>

  <script>
    // Elements
    const video = document.getElementById("webcam");
    const previewCanvas = document.getElementById("previewCanvas");
    const ovalGuide = document.getElementById("ovalGuide");
    const captureBtn = document.getElementById("captureBtn");
    const btnIcon = document.getElementById("btnIcon");
    const btnText = document.getElementById("btnText");
    const retakeBar = document.getElementById("retakeBar");
    const retakeBtn = document.getElementById("retakeBtn");
    const flash = document.getElementById("flash");
    const analysisCanvas = document.getElementById("analysisCanvas");
    const captureCanvas = document.getElementById("captureCanvas");

    let isGreen = false;
    let isCaptured = false;
    let analysisInterval = null;
    let consecutiveGood = 0;
    let consecutiveBad = 0;

    // Feature detection for Shape Detection API (FaceDetector)
    let nativeDetector = null;
    let hasNativeDetector = false;
    if ("FaceDetector" in window) {
      try {
        nativeDetector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 2 });
        hasNativeDetector = true;
      } catch (e) {
        hasNativeDetector = false;
      }
    }

    // Audio Synthetic Shutter Sound
    function playShutterSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e) {}
    }

    // Streamlit Communication
    function postMessageToParent(type, data) {
      window.parent.postMessage(Object.assign({
        isStreamlitMessage: true,
        type: type
      }, data), "*");
    }

    function setComponentValue(value) {
      postMessageToParent("streamlit:setComponentValue", { value: value });
    }

    function setFrameHeight(height) {
      postMessageToParent("streamlit:setFrameHeight", { height: height });
    }

    postMessageToParent("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight(510);

    // Initialize Camera
    navigator.mediaDevices.getUserMedia({
      video: {
        width: { ideal: 1280 },
        height: { ideal: 960 },
        facingMode: "user"
      },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        video.play();
        startBiometricAnalysis();
      };
    }).catch(err => {
      console.error("Camera access error:", err);
      ovalGuide.className = "oval-guide state-red";
      btnText.innerText = "CAMERA ACCESS DENIED";
    });

    // Real-Time Biometric Quality & Alignment Engine
    function startBiometricAnalysis() {
      const aCtx = analysisCanvas.getContext("2d", { willReadFrequently: true });

      analysisInterval = setInterval(async () => {
        if (isCaptured || video.paused || video.ended || video.readyState < 2) return;

        // Render current video frame to analysis canvas
        aCtx.save();
        aCtx.scale(-1, 1);
        aCtx.drawImage(video, -analysisCanvas.width, 0, analysisCanvas.width, analysisCanvas.height);
        aCtx.restore();

        let faceDetected = false;
        let isCentered = false;
        let isGoodSize = false;
        let isSharp = false;
        let isLightingOk = false;

        // 1. Native FaceDetector API (when available)
        if (hasNativeDetector && nativeDetector) {
          try {
            const faces = await nativeDetector.detect(video);
            if (faces && faces.length === 1) {
              faceDetected = true;
              const f = faces[0].boundingBox;
              const vw = video.videoWidth;
              const vh = video.videoHeight;
              
              const normX = (f.x + f.width / 2) / vw;
              const normY = (f.y + f.height / 2) / vh;
              const normW = f.width / vw;
              const normH = f.height / vh;

              // Face center should fall within the tighter circle region
              isCentered = (normX >= 0.38 && normX <= 0.62) && (normY >= 0.32 && normY <= 0.64);
              // Face dimensions fitting the tighter circle
              isGoodSize = (normW >= 0.22 && normW <= 0.52) && (normH >= 0.26 && normH <= 0.65);
            } else {
              faceDetected = false;
            }
          } catch (e) {}
        }

        // 2. High-performance Canvas Computer Vision Quality & Central Alignment Analysis
        const w = analysisCanvas.width;
        const h = analysisCanvas.height;
        const imgData = aCtx.getImageData(0, 0, w, h);
        const data = imgData.data;

        // Centered ellipse for 240x180 canvas matching the new tighter oval
        const cx = w / 2;
        const cy = Math.round(h * 0.48);
        const rx = 36;
        const ry = 49;

        let ovalSumLuma = 0;
        let ovalPixels = 0;
        let prevLuma = null;
        let diffs = [];

        for (let y = cy - ry; y <= cy + ry; y += 2) {
          for (let x = cx - rx; x <= cx + rx; x += 2) {
            const dx = (x - cx) / rx;
            const dy = (y - cy) / ry;
            if (dx * dx + dy * dy <= 1.0) {
              const idx = (Math.floor(y) * w + Math.floor(x)) * 4;
              const r = data[idx];
              const g = data[idx + 1];
              const b = data[idx + 2];
              const luma = 0.299 * r + 0.587 * g + 0.114 * b;
              ovalSumLuma += luma;
              ovalPixels++;

              if (prevLuma !== null) {
                diffs.push(Math.abs(luma - prevLuma));
              }
              prevLuma = luma;
            }
          }
        }

        const avgLuma = ovalPixels > 0 ? (ovalSumLuma / ovalPixels) : 0;
        isLightingOk = (avgLuma >= 48 && avgLuma <= 220);

        if (diffs.length > 0) {
          const meanDiff = diffs.reduce((a, b) => a + b, 0) / diffs.length;
          const varDiff = diffs.reduce((a, b) => a + Math.pow(b - meanDiff, 2), 0) / diffs.length;
          isSharp = varDiff >= 26.0;
        }

        if (!hasNativeDetector || !nativeDetector) {
          isCentered = (avgLuma >= 48 && avgLuma <= 220);
          isGoodSize = true;
          faceDetected = isSharp && isCentered;
        }

        const passesAll = faceDetected && isCentered && isGoodSize && isSharp && isLightingOk;

        if (passesAll) {
          consecutiveGood++;
          consecutiveBad = 0;
        } else {
          consecutiveBad++;
          consecutiveGood = 0;
        }

        // Hysteresis: requires 3 consecutive good frames for green; 2 bad frames triggers red
        if (consecutiveGood >= 3 && !isGreen) {
          setGreenState();
        } else if (consecutiveBad >= 2 && isGreen) {
          setRedState();
        }
      }, 100);
    }

    function setGreenState() {
      isGreen = true;
      ovalGuide.className = "oval-guide state-green";
      captureBtn.className = "capture-btn enabled";
      captureBtn.disabled = false;
      btnIcon.innerText = "📸";
      btnText.innerText = "CAPTURE BIOMETRIC PHOTO";
    }

    function setRedState() {
      isGreen = false;
      ovalGuide.className = "oval-guide state-red";
      captureBtn.className = "capture-btn disabled";
      captureBtn.disabled = true;
      btnIcon.innerText = "🔒";
      btnText.innerText = "FIT FACE IN CIRCLE (100% TO UNLOCK)";
    }

    // Capture Button Action
    captureBtn.addEventListener("click", () => {
      if (!isGreen || isCaptured) return;
      isCaptured = true;
      playShutterSound();

      // Trigger Camera Flash
      flash.style.opacity = "0.9";
      setTimeout(() => { flash.style.opacity = "0"; }, 250);

      // Freeze frame onto capture canvas at full resolution
      captureCanvas.width = video.videoWidth;
      captureCanvas.height = video.videoHeight;
      const cCtx = captureCanvas.getContext("2d");
      
      cCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
      const fullQualityDataUrl = captureCanvas.toDataURL("image/jpeg", 0.95);

      previewCanvas.width = video.videoWidth;
      previewCanvas.height = video.videoHeight;
      const pCtx = previewCanvas.getContext("2d");
      pCtx.drawImage(video, 0, 0, previewCanvas.width, previewCanvas.height);
      
      video.style.display = "none";
      previewCanvas.style.display = "block";
      captureBtn.style.display = "none";
      retakeBar.style.display = "block";

      // Transmit base64 image payload to Streamlit
      setComponentValue({
        action: "captured",
        image_data: fullQualityDataUrl,
        timestamp: Date.now()
      });
    });

    // Retake Button
    retakeBtn.addEventListener("click", () => {
      isCaptured = false;
      video.style.display = "block";
      previewCanvas.style.display = "none";
      captureBtn.style.display = "flex";
      retakeBar.style.display = "none";
      setRedState();
      setComponentValue({ action: "reset", timestamp: Date.now() });
    });

    // Receive Biometric Purity Evaluation result from Streamlit Python
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        const args = event.data.args || {};
        if (args.purity_result && isCaptured) {
          if (args.purity_result.is_pure) {
            setGreenState();
          } else {
            setRedState();
          }
        }
      }
    });
  </script>
</body>
</html>
